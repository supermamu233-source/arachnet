services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arachnet
      POSTGRES_PASSWORD: arachnet
      POSTGRES_DB: arachnet_dev
    ports:
      - "5432:5432"
    volumes:
      - arachnet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arachnet -d arachnet_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: arachnet_minio
      MINIO_ROOT_PASSWORD: arachnet_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - arachnet_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arachnet_postgres_data:
  arachnet_minio_data:
